<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:,">
  <title>Protected engagement</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    :root, html[data-theme="dark"] {
      color-scheme: light;
      --cp-bg: oklch(98.5% .004 265);
      --cp-bg-elevated: oklch(100% 0 0);
      --cp-surface: oklch(100% 0 0);
      --cp-surface-soft: oklch(96% .005 265);
      --cp-border: oklch(92% .005 265);
      --cp-border-strong: oklch(70% .02 265);
      --cp-text: oklch(18% .02 265);
      --cp-text-muted: oklch(50% .02 265);
      --cp-text-soft: oklch(40% .025 265);
      --cp-accent: oklch(52% .18 270);
      --cp-accent-hover: oklch(45% .18 270);
      --cp-accent-soft: color-mix(in oklch, var(--cp-accent) 10%, transparent);
      --cp-accent-fg: oklch(100% 0 0);
      --cp-success: oklch(60% .18 150);
      --cp-danger: oklch(58% .22 27);
      --cp-warning: oklch(75% .16 75);
      --cp-link: oklch(48% .18 255);
      --cp-shadow: 0 1px 2px 0 rgba(18, 22, 31, .04), 0 8px 24px -12px rgba(18, 22, 31, .12);
      --cp-overlay: color-mix(in oklch, var(--cp-bg-elevated) 94%, transparent);
      --cp-panel: color-mix(in oklch, var(--cp-surface) 92%, transparent);
      --cp-panel-strong: var(--cp-surface);
      --cp-sheen: color-mix(in oklch, var(--cp-surface) 65%, transparent);
      --cp-highlight: color-mix(in oklch, var(--cp-accent) 14%, transparent);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: Inter, "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(100%, 440px);
      padding: 28px;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 1.5rem;
      box-shadow: var(--cp-shadow);
    }
    .eyebrow {
      margin: 0;
      color: var(--cp-accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 8px 0 12px; font-size: 1.9rem; line-height: 1.15; }
    p { color: var(--cp-text-muted); }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--cp-border-strong);
      border-radius: 0.75rem;
      background: var(--cp-bg-elevated);
      color: var(--cp-text);
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 11px 14px;
      border: 1px solid var(--cp-accent);
      border-radius: 0.75rem;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    input:focus-visible, button:focus-visible {
      outline: 3px solid var(--cp-accent);
      outline-offset: 3px;
    }
    #status { min-height: 24px; margin-bottom: 0; }
    .error { color: var(--cp-danger); }
    .technical {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--cp-border);
      font-size: 0.78rem;
    }
  </style>
</head>
<body>

    <p class="eyebrow">MCAPS OS | SE OS · Encrypted client-side</p>
    <h1>Protected engagement</h1>
    <p>Enter the shared passphrase. Decryption happens only in this browser; the host stores encrypted content.</p>
    <form id="unlock-form">

      <input id="passphrase" name="passphrase" type="password" minlength="20" required autocomplete="current-password" autofocus>
      <button id="unlock" type="submit">Open engagement</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>

      const form = document.getElementById("unlock-form");
      const input = document.getElementById("passphrase");
      const button = document.getElementById("unlock");
      const status = document.getElementById("status");
      const decoder = new TextDecoder();
      const encoder = new TextEncoder();
      const fromBase64 = (value) =>
        Uint8Array.from(atob(value), (character) => character.charCodeAt(0));

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.checkValidity()) {
          form.reportValidity();
          return;
        }
        button.disabled = true;
        status.className = "";
        status.textContent = "Decrypting…";
        try {
          const material = await crypto.subtle.importKey(
            "raw",
            encoder.encode(input.value),
            "PBKDF2",
            false,
            ["deriveKey"],
          );
          const key = await crypto.subtle.deriveKey(
            {
              name: "PBKDF2",
              hash: "SHA-256",
              salt: fromBase64(payload.salt),
              iterations: payload.iterations,
            },
            material,
            {
              name: "AES-GCM",
              length: 256,
            },
            false,
            ["decrypt"],
          );
          const cleartext = await crypto.subtle.decrypt(
            {
              name: "AES-GCM",
              iv: fromBase64(payload.iv),
            },
            key,
            fromBase64(payload.ciphertext),
          );
          const html = decoder.decode(cleartext);
          input.value = "";
          document.open();
          document.write(html);
          document.close();
        } catch {
          input.select();
          status.className = "error";
          status.textContent = "Unable to open this engagement. Check the passphrase and try again.";
          button.disabled = false;
        }
      });
    })();

<!DOCTYPE html>
<html lang="en" data-brand="atomic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M10 12h18c9 0 14 4 14 11 0 5-3 8-7 10 6 1 10 5 10 11 0 8-6 12-16 12H10V12Zm10 9v8h8c3 0 5-1 5-4s-2-4-5-4h-8Zm0 17v9h9c4 0 6-1 6-4 0-4-2-5-6-5h-9Z' fill='currentColor'/%3E%3C/svg%3E">
  <title>Page not found | Bill Whalen</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    html[data-brand="atomic"] {
      color-scheme: light;
      --cp-bg: #FFFFFF;
      --cp-bg-elevated: #FFFFFF;
      --cp-surface: #FFFFFF;
      --cp-surface-soft: #EAF3FF;
      --cp-border: #B9CAE0;
      --cp-border-strong: #0057B8;
      --cp-text: #142D4E;
      --cp-text-muted: #003B7A;
      --cp-text-soft: #142D4E;
      --cp-accent: #0057B8;
      --cp-accent-hover: #003B7A;
      --cp-accent-soft: #EAF3FF;
      --cp-accent-fg: #FFFFFF;
      --cp-link: #003B7A;
      --cp-shadow: 0 0 2px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.14);
      --cp-overlay: rgba(20, 45, 78, 0.48);
      --cp-panel: #FFFFFF;
      --cp-panel-strong: #FFFFFF;
      --cp-sheen: #FFFFFF;
      --cp-highlight: #EAF3FF;
    }
    html[data-brand="atomic"][data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #07182C;
      --cp-surface: #0D2745;
      --cp-border: #365D85;
      --cp-text: #F5F9FF;
      --cp-text-muted: #B9D8FA;
      --cp-accent: #78B4F8;
      --cp-accent-hover: #A8D2FF;
      --cp-accent-fg: #07182C;
    }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      padding: 1rem;
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    main {
      width: min(34rem, 100%);
      padding: clamp(1.5rem, 7vw, 3.5rem);
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-surface);
      text-align: center;
    }
    p:first-child {
      margin: 0 0 0.5rem;
      color: var(--cp-accent);
      font-family: Consolas, "Courier New", Courier, monospace;
      font-weight: 800;
    }
    h1 { margin: 0 0 1rem; font-size: clamp(2.4rem, 9vw, 4.5rem); letter-spacing: -0.06em; }
    p { color: var(--cp-text-muted); }
    a {
      display: inline-flex;
      margin-top: 1rem;
      padding: 0.72rem 1rem;
      border-radius: 0.625rem;
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: var(--cp-accent-hover); }
    a:focus-visible { outline: 3px solid var(--cp-accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p>404 / ROUTE NOT FOUND</p>
    <h1>This path is between releases.</h1>
    <p>The Atomic Collection is still online. Return home to explore the current public work.</p>
    <a href="/">Back to the collection</a>
  </main>
</body>
</html>
